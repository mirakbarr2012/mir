<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hisob tasdiqlanishi kutilmoqda | Maktab</title>
    <style>
        :root {
            --page-bg: #f5f5f5;
            --card-bg: #fff;
            --text-main: #1f2937;
            --text-subtle: #6b7280;
            --border: #d1d5db;
            --blue: #3867e8;
            --blue-dark: #244cc2;
            --blue-soft: #eaf0ff;
            --shadow: rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: var(--page-bg);
            color: var(--text-main);
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .status-card {
            width: min(100%, 440px);
            padding: 36px 32px 30px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: 16px;
            background: var(--card-bg);
            box-shadow: 0 16px 40px var(--shadow);
            text-align: center;
        }

        .status-icon {
            display: grid;
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            place-items: center;
            border-radius: 20px;
            background: var(--blue-soft);
            color: var(--blue);
            font-size: 30px;
        }

        h1 {
            margin: 0;
            font-size: clamp(23px, 5vw, 29px);
            font-weight: 800;
            letter-spacing: -0.7px;
        }

        .status-copy {
            margin: 12px 0 0;
            color: var(--text-subtle);
            font-size: 15px;
            line-height: 1.65;
        }

        .status-note {
            margin: 22px 0 0;
            padding: 13px 15px;
            border: 1px solid #dbe5ff;
            border-radius: 10px;
            background: #f5f8ff;
            color: #344b80;
            font-size: 13px;
            line-height: 1.55;
        }

        .actions {
            display: grid;
            gap: 10px;
            margin-top: 22px;
        }

        .button {
            display: block;
            padding: 12px 16px;
            border: 1px solid var(--blue);
            border-radius: 9px;
            background: var(--blue);
            color: #fff;
            font-size: 14px;
            font-weight: 750;
            text-decoration: none;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .button:hover {
            transform: translateY(-1px);
            background: var(--blue-dark);
        }

        .button-secondary {
            border-color: var(--border);
            background: #fff;
            color: var(--text-main);
        }

        .button-secondary:hover {
            background: #f9fafb;
        }

        @media (max-width: 480px) {
            .status-card { padding: 30px 22px 24px; }
        }
    </style>
</head>
<body>
    <main class="status-card">
        <div class="status-icon" aria-hidden="true">⌛</div>
        <h1>Hisobingiz tasdiqlanishi kutilmoqda</h1>
        <p class="status-copy">
            Ro‘yxatdan o‘tganingiz uchun rahmat. Hisobingiz hozircha faol emas.
        </p>
        <p class="status-note">
            Tizimga kirish uchun administrator akkauntingizni faollashtirishi kerak.
            Tasdiqlangandan so‘ng qayta urinib ko‘ring.
        </p>
        <nav class="actions" aria-label="Hisob amallari">
            <a class="button" href="{% url 'login' %}">Kirish sahifasiga qaytish</a>
            <a class="button button-secondary" href="{% url 'register' %}">Bosh sahifaga qaytish</a>
        </nav>
    </main>
</body>
</html>
